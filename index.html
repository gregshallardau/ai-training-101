<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>Presentation Framework</title>
		<!-- No stylesheet links: all CSS is imported through /src/main.js so it is cascade-layered.
		     This lone @layer statement pins the layer order BEFORE the bundled CSS loads, so a
		     minifier that drops the statement from src/styles/layers.css can't change precedence. -->
		<style>@layer reveal.reset, reveal.base, reveal.theme, vars.primitive, vars.semantic, theme, components;</style>
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<!-- @slides -->
			</div>
		</div>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
