<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Ideas Map — standalone</title>
	<style>
		html, body { margin: 0; height: 100%; background: var(--bg, #fff); }
		body {
			display: flex; flex-direction: column;
			font: 400 15px/1.4 var(--font-body, ui-sans-serif, system-ui, sans-serif);
			color: var(--fg, #0b0c0e);
			-webkit-font-smoothing: antialiased;
		}
		header {
			flex: none; padding: 0.7rem 1rem;
			font-weight: 600; letter-spacing: -0.01em;
			border-bottom: 1px solid var(--line, #e0e0e0);
		}
		deck-ideas-map {
			flex: 1 1 auto; min-height: 0; display: block;
			/* fill the space this flex child was given, not the 72vh slide cap */
			--ideas-map-max-h: 100%;
		}
	</style>
</head>
<body>
	<header>Ideas in Space — the map</header>
	<deck-ideas-map mode="star-map" controls="mode labels links vectors starmap zoom" label="Ideas in space"></deck-ideas-map>
	<script type="module">
		import '/src/styles/vars/primitives.css';
		import '/src/styles/vars/semantic.css';
		import '/src/components/ideas-map/index.js';
	</script>
</body>
</html>
