<section id="glossary-4" data-slug="glossary-4" data-auto-animate data-transition="zoom fade-out">
	<h2>The Glossary</h2>

	<dl class="columns">
		<dt data-id="term-token">Token</dt>
		<dd data-id="def-token">a chunk of text. A word.</dd>
		<dt data-id="term-vector">Vector</dt>
		<dd data-id="def-vector">a direction and a distance. Similar words (or ideas) point the same way.</dd>
		<dt data-id="term-weight">Weight</dt>
		<dd data-id="def-weight">a dial. How strongly two tokens are connected.</dd>
		<dt data-id="term-model">Model</dt>
		<dd data-id="def-model">all the dial positions together. The complete knowledge.</dd>
		<dt data-id="term-prompt">Prompt</dt>
		<dd data-id="def-prompt">what you type. Where you start.</dd>
	</dl>
</section>
