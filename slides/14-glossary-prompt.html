<section id="glossary-prompt" data-slug="glossary-prompt">
	<h2>The Glossary</h2>
	<dl>
		<dt>Token</dt>
		<dd>a chunk of text. A word.</dd>
		<dt>Vector</dt>
		<dd>a direction and a distance. Similar words (or ideas) point the same way.</dd>
		<dt>Weight</dt>
		<dd>a dial. How strongly two tokens are connected.</dd>
		<dt>Model</dt>
		<dd>all the dial positions together. The complete knowledge.</dd>
		<dt>Prompt</dt>
		<dd>what you type. Where you start.</dd>
	</dl>
</section>
