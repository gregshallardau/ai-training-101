<section id="glossary-prompt" data-slug="glossary-prompt" data-transition="zoom fade-out">
	<h2>The Glossary</h2>
	<p class="fragment"><span class="chip primary">Token</span> <span class="text-muted">— a chunk of text. A word.</span></p>
	<p class="fragment"><span class="chip secondary">Vector</span> <span class="text-muted">— a direction and a distance. Similar words (or ideas) point the same way.</span></p>
	<p class="fragment"><span class="chip success">Weight</span> <span class="text-muted">— a dial. How strongly two tokens are connected.</span></p>
	<p class="fragment"><span class="chip warning">Model</span> <span class="text-muted fragment highlight-current-red">— all the dial positions together. The complete knowledge.</span></p>
	<p class="fragment"><span class="chip danger">Prompt</span> <span class="text-muted fragment highlight-current-red">— what you type. Where you start.</span></p>
</section>
