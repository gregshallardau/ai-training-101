<section id="live-demo" data-slug="live-demo">
	<!--
		Fully self-contained artefact slide:
		  - scoped <style> keyed off #live-demo, semantic custom properties only;
		  - an inline <script type="module"> with ZERO imports;
		  - DOM lookups scoped by the slide's own id (#live-demo), never
		    document.currentScript (null once Vite bundles the inline script);
		  - anything that reads a computed custom property waits for window 'load'
		    (the framework's CSS is JS-injected in dev and may not be live yet when
		    an inline module first runs).
	-->
	<style>
		#live-demo .pulse {
			width: 8rem;
			height: 8rem;
			margin: var(--space-block) auto 0;
			border-radius: var(--radius-round);
			background: var(--primary);
			animation: demo-pulse var(--motion-hero-duration) ease-in-out infinite;
		}
		@keyframes demo-pulse {
			50% {
				transform: scale(1.25);
				opacity: 0.6;
			}
		}
	</style>
	<h2>Live demo</h2>
	<div class="pulse"></div>
	<script type="module">
		addEventListener('load', () => {
			const el = document.getElementById('live-demo').querySelector('.pulse');
			const accent = getComputedStyle(document.documentElement)
				.getPropertyValue('--primary')
				.trim();
			el.title = `accent is ${accent}`;
		});
	</script>
</section>
