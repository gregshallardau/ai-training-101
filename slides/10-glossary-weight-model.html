<section id="glossary-weight-model" data-slug="glossary-weight-model">
	<h2>The Glossary</h2>
	<p><span class="chip primary">Token</span> <span class="text-muted">— a chunk of text. A word.</span></p>
	<p><span class="chip secondary">Vector</span> <span class="text-muted">— a direction and a distance. Similar words (or ideas) point the same way.</span></p>
	<p><span class="chip success">Weight</span> <span class="text-muted">— a dial. How strongly two tokens are connected.</span></p>
	<p><span class="chip warning">Model</span> <span class="text-muted">— all the dial positions together. The complete knowledge.</span></p>
</section>
