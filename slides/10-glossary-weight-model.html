<section id="glossary-weight-model" data-slug="glossary-weight-model">
	<h2>The Glossary</h2>
	<p><strong>Token</strong> <span class="text-muted">— a chunk of text. A word.</span></p>
	<p><strong>Vector</strong> <span class="text-muted">— a direction and a distance. Similar words (or ideas) point the same way.</span></p>
	<p><strong>Weight</strong> <span class="text-muted">— a dial. How strongly two tokens are connected.</span></p>
	<p><strong>Model</strong> <span class="text-muted">— all the dial positions together. The complete knowledge.</span></p>
</section>
